name: Input Mapper Core Tests

on:
  push:
    branches:
      - input-mapper/configurable-pkg
      - input-mapper/prototype-0.1
    paths:
      - "input-mapper/**"
      - ".github/workflows/input-mapper-tests.yml"
  pull_request:
    paths:
      - "input-mapper/**"
      - ".github/workflows/input-mapper-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile mapper core tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinput-mapper/include input-mapper/src/mapper.c \
            input-mapper/tests/test_mapper.c -o /tmp/mapper_test
          /tmp/mapper_test
      - name: Compile profile editor model tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinput-mapper/include input-mapper/src/profile_model.c \
            input-mapper/tests/test_profile_model.c -o /tmp/profile_test
          /tmp/profile_test
      - name: Validate default profile JSON
        run: python3 input-mapper/tests/test_profile.py
