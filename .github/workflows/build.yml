name: Build PS4 Cloud Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl libicu-dev clang lld python3

      - name: Install libssl1.1 required by PkgTool.Core
        shell: bash
        run: |
          set -euo pipefail
          base="https://security.ubuntu.com/ubuntu/pool/main/o/openssl/"
          package="$(curl -fsSL "$base" | grep -oE 'libssl1\.1_1\.1\.1f-[0-9a-z.~+]+_amd64\.deb' | sort -Vu | tail -n 1)"
          if [ -z "$package" ]; then
            echo "Could not locate the Ubuntu libssl1.1 package."
            exit 1
          fi
          curl -fL "$base$package" -o /tmp/libssl1.1.deb
          sudo dpkg -i /tmp/libssl1.1.deb

      - name: Download OpenOrbis PS4 Toolchain v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o /tmp/openorbis-toolchain.tar.gz
          mkdir -p "$RUNNER_TEMP/openorbis"
          tar -xzf /tmp/openorbis-toolchain.tar.gz -C "$RUNNER_TEMP/openorbis"
          link_file="$(find "$RUNNER_TEMP/openorbis" -type f -name link.x -print -quit)"
          if [ -z "$link_file" ]; then
            echo "OpenOrbis toolchain root (link.x) was not found."
            find "$RUNNER_TEMP/openorbis" -maxdepth 4 -type f | head -100
            exit 1
          fi
          toolchain_root="$(dirname "$link_file")"
          echo "OO_PS4_TOOLCHAIN=$toolchain_root" >> "$GITHUB_ENV"
          echo "Using toolchain at $toolchain_root"

          curl -fL https://github.com/OpenOrbis/create-gp4/releases/latest/download/binaries.tar.gz -o /tmp/create-gp4.tar.gz
          mkdir -p /tmp/create-gp4
          tar -xzf /tmp/create-gp4.tar.gz -C /tmp/create-gp4
          install -m 0755 /tmp/create-gp4/bin/linux/create-gp4 "$toolchain_root/bin/linux/create-gp4"

          # The release toolchain archive omits the generated PRX modules.
          curl -fL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/archive/refs/tags/v0.5.4.tar.gz -o /tmp/openorbis-source.tar.gz
          mkdir -p /tmp/openorbis-source
          tar -xzf /tmp/openorbis-source.tar.gz -C /tmp/openorbis-source --strip-components=1
          modules="/tmp/openorbis-source/src/modules"
          export OO_PS4_TOOLCHAIN="$toolchain_root"
          make -C "$modules/libc"
          make -C "$modules/libSceFios2"
          make -C "$modules/right"
          mkdir -p "$toolchain_root/ci_modules"
          cp "$modules/libc/libc.prx" "$toolchain_root/ci_modules/libc.prx"
          cp "$modules/libSceFios2/libSceFios2.prx" "$toolchain_root/ci_modules/libSceFios2.prx"
          cp "$modules/right/right.sprx" "$toolchain_root/ci_modules/right.sprx"

          for required in \
            "$toolchain_root/bin/linux/create-fself" \
            "$toolchain_root/bin/linux/create-gp4" \
            "$toolchain_root/bin/linux/PkgTool.Core" \
            "$toolchain_root/ci_modules/libc.prx" \
            "$toolchain_root/ci_modules/libSceFios2.prx" \
            "$toolchain_root/ci_modules/right.sprx"; do
            if [ ! -s "$required" ]; then
              echo "Missing required build output: $required"
              exit 1
            fi
          done

      - name: Build PKG
        run: |
          set -euo pipefail
          make
          test -s eboot.bin
          test -s IV0000-PSCB00001_00-PS4CLOUDBROWSER0.pkg
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate IV0000-PSCB00001_00-PS4CLOUDBROWSER0.pkg
          sha256sum eboot.bin IV0000-PSCB00001_00-PS4CLOUDBROWSER0.pkg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Cloud-Browser-0.5.1
          path: |
            IV0000-PSCB00001_00-PS4CLOUDBROWSER0.pkg
            eboot.bin
            build/ps4_cloud_browser.elf
          if-no-files-found: error
          retention-days: 30
